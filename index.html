<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiftLand - Music & Crash</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
        .card-bg { background: linear-gradient(135deg, #121216 0%, #1a1a22 100%); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-4 pb-28">

    <!-- FON MUSIQASI UCHUN AUDIO ELEMENT -->
    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <!-- HEADER -->
    <header class="flex justify-between items-center mb-4">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-pink-500 to-purple-600 flex items-center justify-center font-bold text-sm" id="user-avatar">N</div>
            <div>
                <h1 class="font-bold text-xs"><span id="username">Nursultan</span></h1>
                <p class="text-[10px] text-zinc-400">DO IRON 👑</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <!-- Musiqani yoqish/o'chirish tugmasi -->
            <button onclick="toggleMusic()" id="music-btn" class="bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-full text-xs text-zinc-400 hover:text-white transition">
                🎵 <span id="music-status">O'chiq</span>
            </button>
            <div class="flex items-center bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-full space-x-1">
                <span class="text-sm font-extrabold text-cyan-400" id="user-balance">10.00 💎</span>
            </div>
        </div>
    </header>

    <!-- TAB 1: O'YINLAR -->
    <div id="tab-games" class="tab-content active space-y-4">
        
        <!-- CRASH O'YIN OYNASI -->
        <div class="card-bg p-5 text-center relative overflow-hidden border border-blue-500/30">
            <div class="text-xs text-blue-400 font-bold mb-1">🚀 CRASH DEMO O'YINI</div>
            
            <div id="game-screen" class="py-10 bg-black/40 rounded-2xl my-3 border border-zinc-800 flex flex-col items-center justify-center">
                <div id="rocket-icon" class="text-5xl mb-2 transition-transform duration-300">🚀</div>
                <div id="crash-multiplier" class="text-4xl font-black text-cyan-400 tracking-wider">1.00x</div>
                <div id="game-status-text" class="text-xs text-zinc-400 mt-2">O'ynash uchun tugmani bosing</div>
            </div>

            <div class="space-y-3">
                <div class="flex justify-between items-center px-2 text-xs text-zinc-400">
                    <span>Tikish summasi:</span>
                    <span class="text-cyan-400 font-bold">1.00 💎</span>
                </div>
                
                <button id="action-btn" onclick="toggleGame()" class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-cyan-500 font-bold rounded-xl text-sm shadow-lg transition active:scale-98">
                    O'YINNI BOSHLASH (1 💎)
                </button>
            </div>
        </div>
    </div>

    <!-- TAB 2: INVENTAR -->
    <div id="tab-inventory" class="tab-content space-y-3">
        <h2 class="text-sm font-bold mb-2">📦 INVENTAR</h2>
        <div class="card-bg p-5 text-center text-zinc-400 text-xs">Hozircha inventar bo'sh.</div>
    </div>

    <!-- TAB 3: VAZIFALAR -->
    <div id="tab-tasks" class="tab-content space-y-3">
        <h2 class="text-sm font-bold mb-2">📋 VAZIFALAR</h2>
        <div class="card-bg p-4 flex justify-between items-center">
            <span class="text-xs">Kunlik bonus (+1 💎)</span>
            <button onclick="claimBonus()" class="bg-blue-600 px-3 py-1.5 rounded-xl text-xs font-bold">Olish</button>
        </div>
    </div>

    <!-- TAB 4: LIDERLAR -->
    <div id="tab-leaders" class="tab-content space-y-3">
        <h2 class="text-sm font-bold mb-2">🏆 LIDERLAR</h2>
        <div class="card-bg p-3.5 flex justify-between items-center text-xs">
            <span>🥇 1. Nursultan</span>
            <span class="text-cyan-400 font-bold">15.00 💎</span>
        </div>
    </div>

    <!-- PASTKI NAVIGATSIYA -->
    <nav class="fixed bottom-0 left-0 right-0 bg-zinc-950/95 backdrop-blur-xl border-t border-zinc-800/80 flex justify-around py-3 px-2 z-50">
        <button onclick="switchTab('inventory')" id="nav-inventory" class="flex flex-col items-center text-zinc-400 text-[11px]"><span>📦</span><span>Inventar</span></button>
        <button onclick="switchTab('games')" id="nav-games" class="flex flex-col items-center text-blue-500 font-bold text-[11px]"><span>🎮</span><span>O'yinlar</span></button>
        <button onclick="switchTab('tasks')" id="nav-tasks" class="flex flex-col items-center text-zinc-400 text-[11px]"><span>📋</span><span>Vazifalar</span></button>
        <button onclick="switchTab('leaders')" id="nav-leaders" class="flex flex-col items-center text-zinc-400 text-[11px]"><span>🏆</span><span>Liderlar</span></button>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 10.00;
        let gameInterval = null;
        let currentMultiplier = 1.00;
        let targetCrash = 1.00;
        let isPlaying = false;
        let isMusicPlaying = false;

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
            document.getElementById('user-avatar').innerText = tg.initDataUnsafe.user.first_name[0].toUpperCase();
        }

        // Musiqani boshqarish
        function toggleMusic() {
            const music = document.getElementById('bg-music');
            const statusText = document.getElementById('music-status');
            
            if (!isMusicPlaying) {
                music.play();
                isMusicPlaying = true;
                statusText.innerText = "Yoqilgan";
                statusText.className = "text-emerald-400 font-bold";
            } else {
                music.pause();
                isMusicPlaying = false;
                statusText.innerText = "O'chiq";
                statusText.className = "";
            }
            tg.HapticFeedback.selectionChanged();
        }

        function updateBalance() {
            document.getElementById('user-balance').innerText = balance.toFixed(2) + ' 💎';
        }

        function getRandomCrashPoint() {
            let rnd = Math.random() * 100;
            if (rnd < 0.0001) return +(100 + Math.random() * 400).toFixed(2);
            else if (rnd < 5) return +(10 + Math.random() * 20).toFixed(2);
            else if (rnd < 25) return +(2.0 + Math.random() * 0.99).toFixed(2);
            else return +(1.01 + Math.random() * 0.98).toFixed(2);
        }

        function toggleGame() {
            const btn = document.getElementById('action-btn');
            
            if (!isPlaying) {
                if (balance < 1) {
                    alert("Balansda mablag' yetarli emas!");
                    return;
                }
                balance -= 1.00;
                updateBalance();

                isPlaying = true;
                currentMultiplier = 1.00;
                targetCrash = getRandomCrashPoint();
                
                btn.innerText = "PULNI OLISH (CASH OUT)";
                btn.className = "w-full py-3.5 bg-gradient-to-r from-emerald-600 to-green-500 font-bold rounded-xl text-sm shadow-lg transition active:scale-98 animate-pulse";
                document.getElementById('game-status-text').innerText = "Raketa uchmoqda...";

                gameInterval = setInterval(() => {
                    currentMultiplier += 0.02;
                    if (currentMultiplier >= targetCrash) {
                        currentMultiplier = targetCrash;
                        endGame(false);
                    }
                    document.getElementById('crash-multiplier').innerText = currentMultiplier.toFixed(2) + 'x';
                    document.getElementById('rocket-icon').style.transform = `scale(${1 + currentMultiplier * 0.05})`;
                }, 100);
            } else {
                endGame(true);
            }
        }

        function endGame(won) {
            clearInterval(gameInterval);
            isPlaying = false;
            const btn = document.getElementById('action-btn');
            
            if (won) {
                let winAmount = 1.00 * currentMultiplier;
                balance += winAmount;
                document.getElementById('game-status-text').innerText = `Tabriklaymiz! Siz ${winAmount.toFixed(2)} 💎 yutib oldingiz!`;
                document.getElementById('crash-multiplier').style.color = '#10b981';
            } else {
                document.getElementById('game-status-text').innerText = `Raketa portladi! (${targetCrash}x)`;
                document.getElementById('crash-multiplier').style.color = '#ef4444';
            }

            updateBalance();
            btn.innerText = "QAYTADAN O'YNASH (1 💎)";
            btn.className = "w-full py-3.5 bg-gradient-to-r from-blue-600 to-cyan-500 font-bold rounded-xl text-sm shadow-lg transition active:scale-98";
            
            setTimeout(() => {
                document.getElementById('crash-multiplier').style.color = '#22d3ee';
            }, 3000);
        }

        function claimBonus() {
            balance += 1.00;
            updateBalance();
            alert("Kunlik bonus qo'shildi!");
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => {
                el.classList.remove('text-blue-500', 'font-bold');
                el.classList.add('text-zinc-400');
            });
            document.getElementById('tab-' + tab).classList.add('active');
            let activeNav = document.getElementById('nav-' + tab);
            activeNav.classList.remove('text-zinc-400');
            activeNav.classList.add('text-blue-500', 'font-bold');
            tg.HapticFeedback.selectionChanged();
        }
    </script>
</body>
</html>
