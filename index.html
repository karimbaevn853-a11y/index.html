<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiftLand - Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; overflow-x: hidden; }
        .card { background: #111113; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; }
        #canvas-container { width: 100%; height: 160px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="p-4 pb-24">

    <!-- HEADER (Profil va Balans) -->
    <header class="flex justify-between items-center mb-4 cursor-pointer" onclick="openProfile()">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-red-500 flex items-center justify-center font-bold text-lg" id="user-avatar">N</div>
            <div>
                <h1 class="font-bold text-sm" id="username">Nursultan</h1>
                <p class="text-[10px] text-zinc-400">Profilni ko'rish ⚙️</p>
            </div>
        </div>
        <div class="flex items-center bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-full space-x-2">
            <span class="text-sm font-bold text-cyan-400" id="user-balance">0.00 💎</span>
            <button onclick="event.stopPropagation(); topUpBalance()" class="w-6 h-6 bg-blue-600 rounded-full flex items-center justify-center text-xs font-bold">+</button>
        </div>
    </header>

    <!-- TAB 1: O'YINLAR (GAMES) -->
    <div id="tab-games" class="tab-content active space-y-3">
        <!-- 3D Element -->
        <div class="card p-2 relative">
            <div id="canvas-container"></div>
        </div>

        <!-- Slots O'yini -->
        <div class="card p-4 flex justify-between items-center cursor-pointer active:scale-95 transition" onclick="playGame('Slots')">
            <div>
                <span class="text-xs text-red-400 font-bold">✨ SLOTS</span>
                <h2 class="text-lg font-bold">Omadli o'yin</h2>
            </div>
            <span class="text-2xl">🎰</span>
        </div>

        <!-- Crash O'yini -->
        <div class="card p-4 flex justify-between items-center cursor-pointer active:scale-95 transition" onclick="playGame('Crash')">
            <div>
                <span class="text-xs text-blue-400 font-bold">📈 CRASH</span>
                <h2 class="text-lg font-bold">Raketa parvozi</h2>
            </div>
            <span class="text-2xl">🚀</span>
        </div>
    </div>

    <!-- TAB 2: INVENTAR -->
    <div id="tab-inventory" class="tab-content space-y-3">
        <h2 class="text-lg font-bold mb-2">📦 Sizning yutuqlaringiz</h2>
        <div class="card p-4 text-center text-zinc-400 text-sm">
            Hozircha inventar bo'sh. O'yinlarni o'ynab sovg'alar yutib oling!
        </div>
    </div>

    <!-- TAB 3: ZADANIYA -->
    <div id="tab-tasks" class="tab-content space-y-3">
        <h2 class="text-lg font-bold mb-2">💎 Kunlik vazifalar</h2>
        <div class="card p-4 flex justify-between items-center">
            <div>
                <h3 class="font-bold text-sm">Do'st taklif qilish</h3>
                <p class="text-xs text-zinc-400">+0.50 💎 mukofot</p>
            </div>
            <button onclick="alert('Havola nusxalandi!')" class="bg-blue-600 px-3 py-1.5 rounded-xl text-xs font-bold">Bajarish</button>
        </div>
    </div>

    <!-- TAB 4: LIDERLAR -->
    <div id="tab-leaders" class="tab-content space-y-3">
        <h2 class="text-lg font-bold mb-2">🏆 Top O'yinchilar</h2>
        <div class="card p-3 flex justify-between items-center">
            <span class="text-sm">🥇 1. Nursultan</span>
            <span class="text-sm font-bold text-cyan-400">12.50 💎</span>
        </div>
    </div>

    <!-- PASTKI MENYU -->
    <nav class="fixed bottom-0 left-0 right-0 bg-zinc-950 border-t border-zinc-800 flex justify-around py-3">
        <button onclick="switchTab('inventory')" id="nav-inventory" class="flex flex-col items-center text-zinc-400 text-xs">📦 Inventar</button>
        <button onclick="switchTab('games')" id="nav-games" class="flex flex-col items-center text-blue-500 font-bold text-xs">🎮 O'yinlar</button>
        <button onclick="switchTab('tasks')" id="nav-tasks" class="flex flex-col items-center text-zinc-400 text-xs">💎 Zadaniya</button>
        <button onclick="switchTab('leaders')" id="nav-leaders" class="flex flex-col items-center text-zinc-400 text-xs">🏆 Liderlar</button>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
            document.getElementById('user-avatar').innerText = tg.initDataUnsafe.user.first_name[0].toUpperCase();
        }

        // Balansni to'ldirish funksiyasi
        function topUpBalance() {
            tg.showAlert("Balansni to'ldirish uchun botga to'lov qiling yoki administratorga murojaat qiling!");
        }

        // Profilga bosganda nima yutgani chiqishi
        function openProfile() {
            tg.showAlert("Profil: Nursultan\nBalans: 0.00 💎\nYutuqlar: Hozircha yutuqlar yo'q.");
        }

        // O'yinlarni ochish
        function playGame(gameName) {
            tg.HapticFeedback.impactOccurred('medium');
            let balance = 0.00; // Balans 0
            if (balance <= 0) {
                tg.showAlert("Balansda yetarli mablag' yo'q! O'ynash uchun balansni to'ldiring.");
            } else {
                tg.showAlert(gameName + " o'yini boshlanmoqda!");
            }
        }

        // Pastki menyularni boshqarish
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => {
                el.classList.remove('text-blue-500', 'font-bold');
                el.classList.add('text-zinc-400');
            });

            document.getElementById('tab-' + tab).classList.add('active');
            let activeNav = document.getElementById('nav-' + tab);
            activeNav.classList.remove('text-zinc-400');
            activeNav.classList.add('text-blue-500', 'font-bold');
            tg.HapticFeedback.selectionChanged();
        }

        // 3D Three.js Animation
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.5));
        const geometry = new THREE.IcosahedronGeometry(1.2, 0);
        const material = new THREE.MeshStandardMaterial({ color: 0x3b82f6, metalness: 0.8, roughness: 0.2 });
        const crystal = new THREE.Mesh(geometry, material);
        scene.add(crystal);
        camera.position.z = 3.5;

        function animate() {
            requestAnimationFrame(animate);
            crystal.rotation.x += 0.01;
            crystal.rotation.y += 0.015;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
